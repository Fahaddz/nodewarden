name: AI PR Review

on: # zizmor: ignore[dangerous-triggers] privileged job uses protected main, validates repo/branch/SHA, and never executes PR code
  workflow_run:
    workflows:
      - CI
      - CodeQL Advanced
      - Extra Security Scan
    types:
      - completed
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number to review manually
        required: true

permissions:
  contents: write
  actions: read
  pull-requests: write
  issues: write

concurrency:
  group: ai-pr-review-${{ github.event.workflow_run.head_sha || github.event.inputs.pr_number || github.run_id }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: main
          persist-credentials: false

      - name: Resolve PR context
        id: context
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_PATH: ${{ github.event_path }}
          INPUT_PR_NUMBER: ${{ github.event.inputs.pr_number || '' }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "workflow_run" ]; then
            PR_NUMBER="$(jq -r '.workflow_run.pull_requests[0].number // empty' "$EVENT_PATH")"
            HEAD_BRANCH="$(jq -r '.workflow_run.head_branch // empty' "$EVENT_PATH")"
            TRIGGER_HEAD_SHA="$(jq -r '.workflow_run.head_sha // empty' "$EVENT_PATH")"
            if [ -z "$PR_NUMBER" ] || [[ "$HEAD_BRANCH" != upstream-sync/* ]]; then
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          else
            PR_NUMBER="$INPUT_PR_NUMBER"
            TRIGGER_HEAD_SHA=""
          fi

          gh api "repos/${{ github.repository }}/pulls/$PR_NUMBER" > pr-api.json
          gh pr view "$PR_NUMBER" --json number,title,body,headRefName,baseRefName,url,changedFiles,commits,author,mergeable,state > pr.json

          PR_HEAD="$(jq -r '.head.ref' pr-api.json)"
          PR_HEAD_SHA="$(jq -r '.head.sha' pr-api.json)"
          PR_HEAD_REPO="$(jq -r '.head.repo.full_name' pr-api.json)"
          PR_BASE="$(jq -r '.base.ref' pr-api.json)"
          PR_STATE="$(jq -r '.state' pr-api.json)"
          if [[ "$PR_HEAD" != upstream-sync/* ]] || \
             [ "$PR_BASE" != "main" ] || \
             [ "$PR_HEAD_REPO" != "${{ github.repository }}" ] || \
             [ "$PR_STATE" != "open" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ -n "$TRIGGER_HEAD_SHA" ] && [ "$TRIGGER_HEAD_SHA" != "$PR_HEAD_SHA" ]; then
            echo "Triggering check is stale for the current PR head; skipping review."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          gh api "repos/${{ github.repository }}/actions/runs?head_sha=$PR_HEAD_SHA&per_page=100" > workflow-runs.json
          jq '
            ["CI", "CodeQL Advanced", "Extra Security Scan"] as $required |
            [
              $required[] as $name |
              ([.workflow_runs[] | select(.name == $name)] | sort_by(.created_at) | reverse | .[0]) as $run |
              {
                name: $name,
                status: ($run.status // "missing"),
                conclusion: ($run.conclusion // "missing"),
                url: ($run.html_url // null)
              }
            ] as $workflows |
            {
              requiredWorkflows: $workflows,
              allPassed: ($workflows | all(.status == "completed" and .conclusion == "success"))
            }
          ' workflow-runs.json > security.json

          gh pr diff "$PR_NUMBER" --patch > pr.diff
          gh api "repos/${{ github.repository }}/pulls/$PR_NUMBER/files?per_page=100" --paginate --slurp |
            jq 'add // []' > pr-files.json

          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          echo "head_sha=$PR_HEAD_SHA" >> "$GITHUB_OUTPUT"

      - name: Generate AI review
        if: steps.context.outputs.skip != 'true'
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL: ${{ vars.AI_REVIEW_MODEL }}
          AUTO_MERGE_MAX_RISK: ${{ vars.AI_AUTO_MERGE_MAX_RISK }}
          PR_METADATA_PATH: pr.json
          SECURITY_METADATA_PATH: security.json
          PR_FILES_PATH: pr-files.json
          DIFF_PATH: pr.diff
          OUTPUT_PATH: ai-review.md
          DECISION_PATH: ai-decision.json
          MAX_DIFF_CHARS: "240000"
          DEEPSEEK_MAX_ATTEMPTS: "5"
        run: |
          node .github/scripts/ai-pr-review.cjs

      - name: Create or update PR comment
        if: steps.context.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.context.outputs.pr_number }}
        run: |
          set -euo pipefail

          MARKER="<!-- ai-upstream-review -->"
          jq -Rs --arg marker "$MARKER"$'\n' '{body: ($marker + .)}' ai-review.md > comment.json

          COMMENT_ID="$(gh api "repos/${{ github.repository }}/issues/$PR_NUMBER/comments" --paginate | jq -r '.[] | select(.user.login == "github-actions[bot]" and (.body | contains("<!-- ai-upstream-review -->"))) | .id' | tail -n 1)"

          if [ -n "$COMMENT_ID" ]; then
            gh api "repos/${{ github.repository }}/issues/comments/$COMMENT_ID" --method PATCH --input comment.json > /dev/null
          else
            gh api "repos/${{ github.repository }}/issues/$PR_NUMBER/comments" --method POST --input comment.json > /dev/null
          fi

      - name: Apply risk label and guarded review decision
        if: steps.context.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.context.outputs.pr_number }}
        run: |
          set -euo pipefail

          RISK_LEVEL="$(jq -r '.effectiveRiskLevel' ai-decision.json)"
          REVIEW_EVENT="$(jq -r '.reviewEvent' ai-decision.json)"
          RISK_SCORE="$(jq -r '.riskScore' ai-decision.json)"

          gh label create "ai-risk: low" --color "2DA44E" --description "AI risk score: low" --force
          gh label create "ai-risk: medium" --color "BF8700" --description "AI risk score: medium or sensitive paths need review" --force
          gh label create "ai-risk: high" --color "CF222E" --description "AI risk score: high or checks failed" --force

          for label in "ai-risk: low" "ai-risk: medium" "ai-risk: high"; do
            gh issue edit "$PR_NUMBER" --remove-label "$label" > /dev/null 2>&1 || true
          done
          gh issue edit "$PR_NUMBER" --add-label "ai-risk: $RISK_LEVEL"

          case "$REVIEW_EVENT" in
            APPROVE)
              BODY="Guarded AI approval: risk score $RISK_SCORE/100 is within the configured threshold. All required workflows passed, the diff was complete, DeepSeek explicitly recommended approval, and no sensitive deterministic rule matched. This PR will now be auto-merged."
              ;;
            REQUEST_CHANGES)
              BODY="Guarded AI review: risk score $RISK_SCORE/100. Do not merge until the AI findings and failed or sensitive checks are manually resolved."
              ;;
            COMMENT)
              echo "No formal approval: this PR needs manual review."
              exit 0
              ;;
            *)
              echo "Invalid review event: $REVIEW_EVENT"
              exit 1
              ;;
          esac

          jq -n --arg body "$BODY" --arg event "$REVIEW_EVENT" '{body: $body, event: $event}' > review.json
          gh api "repos/${{ github.repository }}/pulls/$PR_NUMBER/reviews" --method POST --input review.json > /dev/null

      - name: Guarded auto-merge
        if: steps.context.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.context.outputs.pr_number }}
          REVIEWED_HEAD_SHA: ${{ steps.context.outputs.head_sha }}
        run: |
          set -euo pipefail

          if [ "$(jq -r '.autoMergeEligible' ai-decision.json)" != "true" ]; then
            echo "Risk policy did not authorize auto-merge."
            exit 0
          fi

          gh api "repos/${{ github.repository }}/pulls/$PR_NUMBER" > merge-pr.json
          CURRENT_HEAD_SHA="$(jq -r '.head.sha' merge-pr.json)"
          CURRENT_HEAD_REPO="$(jq -r '.head.repo.full_name' merge-pr.json)"
          CURRENT_HEAD_BRANCH="$(jq -r '.head.ref' merge-pr.json)"
          CURRENT_BASE="$(jq -r '.base.ref' merge-pr.json)"
          CURRENT_STATE="$(jq -r '.state' merge-pr.json)"

          if [ "$CURRENT_HEAD_SHA" != "$REVIEWED_HEAD_SHA" ] || \
             [ "$CURRENT_HEAD_REPO" != "${{ github.repository }}" ] || \
             [[ "$CURRENT_HEAD_BRANCH" != upstream-sync/* ]] || \
             [ "$CURRENT_BASE" != "main" ] || \
             [ "$CURRENT_STATE" != "open" ]; then
            echo "PR context changed after review; refusing to merge."
            exit 1
          fi

          gh api "repos/${{ github.repository }}/actions/runs?head_sha=$CURRENT_HEAD_SHA&per_page=100" > merge-runs.json
          if ! jq -e '
            ["CI", "CodeQL Advanced", "Extra Security Scan"] as $required |
            [
              $required[] as $name |
              ([.workflow_runs[] | select(.name == $name)] | sort_by(.created_at) | reverse | .[0]) as $run |
              $run.status == "completed" and $run.conclusion == "success"
            ] | all
          ' merge-runs.json > /dev/null; then
            echo "A required workflow is no longer successful; refusing to merge."
            exit 1
          fi

          gh pr merge "$PR_NUMBER" \
            --repo "${{ github.repository }}" \
            --auto \
            --merge \
            --match-head-commit "$CURRENT_HEAD_SHA"
          echo "Guarded upstream PR merged or queued for GitHub auto-merge. The normal main-branch deployment begins only after GitHub completes the merge."
