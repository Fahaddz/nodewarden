name: Upstream Main PR

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: Upstream release tag or full commit SHA (blank = upstream/main)
        required: false
        type: string

permissions:
  contents: read
  issues: write

concurrency:
  group: upstream-main-pr
  cancel-in-progress: true

jobs:
  sync-and-open-pr:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: main
          persist-credentials: false

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Ensure bot token exists
        env:
          PUSH_TOKEN: ${{ secrets.PR_BOT_TOKEN }}
        run: |
          test -n "$PUSH_TOKEN" || { echo "Missing secret: PR_BOT_TOKEN"; exit 1; }

      - name: Fetch upstream main and releases
        run: |
          git remote add upstream https://github.com/shuaiplus/NodeWarden.git
          git fetch --force upstream \
            "+refs/heads/main:refs/remotes/upstream/main" \
            "+refs/tags/*:refs/tags/*"

      - name: Resolve upstream target
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_REF: ${{ inputs.upstream_ref || '' }}
        run: |
          set -euo pipefail

          TARGET_REF="$REQUESTED_REF"
          if [ -z "$TARGET_REF" ]; then
            TARGET_REF="main"
            TARGET_SHA="$(git rev-parse --verify refs/remotes/upstream/main)"
          fi

          case "$TARGET_REF" in
            "" | -* | *[!A-Za-z0-9._/-]*)
              echo "Invalid upstream ref: $TARGET_REF"
              exit 1
              ;;
          esac

          if [ "$TARGET_REF" != "main" ]; then
            if [[ "$TARGET_REF" =~ ^[0-9a-fA-F]{40}$ ]]; then
              TARGET_SHA="$(git rev-parse --verify "${TARGET_REF}^{commit}" 2>/dev/null || true)"
            elif git show-ref --verify --quiet "refs/tags/$TARGET_REF"; then
              TARGET_SHA="$(git rev-parse --verify "refs/tags/${TARGET_REF}^{commit}" 2>/dev/null || true)"
            else
              echo "Manual refs must be an upstream release tag or a full commit SHA."
              exit 1
            fi
          fi

          if [ -z "$TARGET_SHA" ]; then
            echo "Cannot resolve upstream ref '$TARGET_REF' to a commit."
            exit 1
          fi

          if ! git merge-base --is-ancestor "$TARGET_SHA" refs/remotes/upstream/main; then
            echo "Ref '$TARGET_REF' is not part of upstream/main."
            exit 1
          fi

          if [ "$TARGET_REF" = "main" ]; then
            BRANCH="upstream-sync/main"
          else
            SAFE_REF="$(printf '%s' "$TARGET_REF" | tr '/ ' '--' | tr -cd 'A-Za-z0-9._-')"
            BRANCH="upstream-sync/${SAFE_REF}-${TARGET_SHA:0:12}"
          fi

          {
            echo "ref=$TARGET_REF"
            echo "sha=$TARGET_SHA"
            echo "branch=$BRANCH"
          } >> "$GITHUB_OUTPUT"

      - name: Refuse unreviewed upstream automation changes
        env:
          GH_TOKEN: ${{ github.token }}
          PUSH_TOKEN: ${{ secrets.PR_BOT_TOKEN }}
          REPO: ${{ github.repository }}
          TARGET_SHA: ${{ steps.target.outputs.sha }}
        run: |
          set -euo pipefail

          EXPECTED_TREE="$(tr -d '[:space:]' < .github/UPSTREAM_AUTOMATION_TREE)"
          CURRENT_TREE="$(git rev-parse "$TARGET_SHA:.github" 2>/dev/null || true)"
          if [[ ! "$EXPECTED_TREE" =~ ^[0-9a-f]{40}$ ]] || [[ ! "$CURRENT_TREE" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Cannot validate the upstream .github tree."
            exit 1
          fi

          if [ "$CURRENT_TREE" = "$EXPECTED_TREE" ]; then
            echo "Upstream automation matches the reviewed baseline."
            exit 0
          fi

          TITLE="Security review required: upstream automation changed"
          BODY_FILE="$(mktemp)"
          {
            echo "Upstream changed its \`.github/\` directory. The application sync was stopped before creating or updating a PR."
            echo
            echo "- Reviewed tree: \`$EXPECTED_TREE\`"
            echo "- Current tree: \`$CURRENT_TREE\`"
            echo "- Upstream commit: \`$TARGET_SHA\`"
            echo
            echo "Nothing from upstream \`.github/\` was imported. Audit the workflow changes, selectively update this fork's stronger checks if useful, then update \`.github/UPSTREAM_AUTOMATION_TREE\` through a protected PR."
            echo
            echo "Changed upstream automation paths:"
            if git cat-file -e "${EXPECTED_TREE}^{tree}" 2>/dev/null; then
              git diff --name-status "$EXPECTED_TREE" "$CURRENT_TREE" | sed 's/^/- `/' | sed 's/$/`/'
            else
              git ls-tree -r --name-only "$CURRENT_TREE" | sed 's/^/- current: `/' | sed 's/$/`/'
            fi
          } > "$BODY_FILE"

          set +e
          EXISTING="$(gh issue list --repo "$REPO" --state open --search "$TITLE in:title" --json number --jq '.[0].number // empty' 2>/dev/null)"
          ISSUE_OK=$?
          set -e
          if [ "$ISSUE_OK" -eq 0 ] && [ -n "$EXISTING" ]; then
            gh issue edit "$EXISTING" --repo "$REPO" --body-file "$BODY_FILE" > /dev/null
          elif [ "$ISSUE_OK" -eq 0 ]; then
            gh issue create --repo "$REPO" --title "$TITLE" --body-file "$BODY_FILE" > /dev/null
          else
            # Issues are disabled in this repository; report via PR instead.
            git checkout -B conflict-report/automation origin/main
            cp "$BODY_FILE" CONFLICT_REPORT.md
            git add CONFLICT_REPORT.md
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "docs: report: $TITLE"
            git remote set-url origin "https://x-access-token:${PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
            git push --force origin "HEAD:refs/heads/conflict-report/automation"
            git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"
            EXISTING_P="$(gh pr list --repo "$REPO" --state open --head conflict-report/automation --json number --jq '.[0].number // empty')"
            if [ -n "$EXISTING_P" ]; then
              GH_TOKEN="$PUSH_TOKEN" gh pr edit "$EXISTING_P" --repo "$REPO" --body-file "$BODY_FILE" > /dev/null
            else
              GH_TOKEN="$PUSH_TOKEN" gh pr create --repo "$REPO" --base main --head conflict-report/automation --title "$TITLE" --body-file "$BODY_FILE" > /dev/null
            fi
          fi

          exit 1

      - name: Check whether the target is already merged
        id: check
        env:
          TARGET_SHA: ${{ steps.target.outputs.sha }}
        run: |
          if git merge-base --is-ancestor "$TARGET_SHA" origin/main; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
            echo "The selected upstream target is already contained in main."
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Merge upstream into review branch
        if: steps.check.outputs.needed == 'true'
        id: merge
        env:
          TARGET_SHA: ${{ steps.target.outputs.sha }}
          REVIEW_BRANCH: ${{ steps.target.outputs.branch }}
        run: |
          set -euo pipefail
          git checkout -B "$REVIEW_BRANCH" origin/main

          if git merge --no-ff --no-edit "$TARGET_SHA"; then
            # Automation is owned by this fork. Never let untrusted upstream
            # commits alter workflows or scripts on a same-repository PR branch.
            git restore --source=origin/main --staged --worktree -- .github
            git commit --amend --no-edit
          else
            git diff --name-only --diff-filter=U > all-conflicts.txt
            grep -v '^\.github/' all-conflicts.txt > conflicts.txt || true

            if [ -s conflicts.txt ]; then
              # Dependency files are owned by this fork: both upstream and
              # this fork bump deps (fork bumps come from security-gate
              # fixes). Keep the fork's audit-gated versions, then let npm
              # bump any vulnerable transitive dependencies so the sync
              # PR's security checks stay green.
              if grep -qvx 'package.json\|package-lock.json' conflicts.txt; then
                git merge --abort
                echo "conflicted=true" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              git checkout --ours -- package.json package-lock.json
              git add package.json package-lock.json
              npm install --package-lock-only --ignore-scripts > /dev/null 2>&1 || true
              npm audit fix --package-lock-only --ignore-scripts > /dev/null 2>&1 || true
              git add package-lock.json package.json
              git commit --no-edit
            else
              # Conflicts only inside .github are resolved deterministically
              # by retaining the fork's trusted copy. AI never chooses this
              # result.
              git restore --source=origin/main --staged --worktree -- .github
              git add -A .github
              git commit --no-edit
            fi
          fi

          if ! git diff --quiet origin/main -- .github; then
            echo "Fork-owned .github files changed unexpectedly; refusing to push."
            exit 1
          fi

          echo "conflicted=false" >> "$GITHUB_OUTPUT"

      - name: Report conflicts without changing code
        if: steps.merge.outputs.conflicted == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PUSH_TOKEN: ${{ secrets.PR_BOT_TOKEN }}
          REPO: ${{ github.repository }}
          TARGET_REF: ${{ steps.target.outputs.ref }}
          TARGET_SHA: ${{ steps.target.outputs.sha }}
        run: |
          set -euo pipefail
          TITLE="Manual upstream conflict resolution required: $TARGET_REF"
          BODY_FILE="$(mktemp)"
          {
            echo "The upstream target could not be merged automatically. No code was pushed and no conflict was auto-resolved."
            echo
            echo "Upstream ref: \`$TARGET_REF\`"
            echo "Upstream commit: \`$TARGET_SHA\`"
            echo
            echo "Conflicted files:"
            sed 's/^/- `/' conflicts.txt | sed 's/$/`/'
            echo
            echo "Resolve these conflicts locally, review the result, and open a normal pull request."
          } > "$BODY_FILE"

          set +e
          EXISTING="$(gh issue list --repo "$REPO" --state open --search "$TITLE in:title" --json number --jq '.[0].number // empty' 2>/dev/null)"
          ISSUE_OK=$?
          set -e
          if [ "$ISSUE_OK" -eq 0 ] && [ -n "$EXISTING" ]; then
            gh issue edit "$EXISTING" --repo "$REPO" --body-file "$BODY_FILE" > /dev/null
          elif [ "$ISSUE_OK" -eq 0 ]; then
            gh issue create --repo "$REPO" --title "$TITLE" --body-file "$BODY_FILE" > /dev/null
          else
            # Issues are disabled in this repository; report via PR instead.
            git checkout -B conflict-report/conflicts origin/main
            cp "$BODY_FILE" CONFLICT_REPORT.md
            git add CONFLICT_REPORT.md
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "docs: report: $TITLE"
            git remote set-url origin "https://x-access-token:${PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
            git push --force origin "HEAD:refs/heads/conflict-report/conflicts"
            git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"
            EXISTING_P="$(gh pr list --repo "$REPO" --state open --head conflict-report/conflicts --json number --jq '.[0].number // empty')"
            if [ -n "$EXISTING_P" ]; then
              GH_TOKEN="$PUSH_TOKEN" gh pr edit "$EXISTING_P" --repo "$REPO" --body-file "$BODY_FILE" > /dev/null
            else
              GH_TOKEN="$PUSH_TOKEN" gh pr create --repo "$REPO" --base main --head conflict-report/conflicts --title "$TITLE" --body-file "$BODY_FILE" > /dev/null
            fi
          fi

          exit 1

      - name: Push review branch
        if: steps.check.outputs.needed == 'true' && steps.merge.outputs.conflicted != 'true'
        env:
          PUSH_TOKEN: ${{ secrets.PR_BOT_TOKEN }}
          REVIEW_BRANCH: ${{ steps.target.outputs.branch }}
        run: |
          set -euo pipefail
          trap 'git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"' EXIT
          git remote set-url origin "https://x-access-token:${PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force-with-lease origin "HEAD:refs/heads/$REVIEW_BRANCH"

      - name: Create or update PR
        if: steps.check.outputs.needed == 'true' && steps.merge.outputs.conflicted != 'true'
        env:
          GH_TOKEN: ${{ secrets.PR_BOT_TOKEN }}
          REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          REVIEW_BRANCH: ${{ steps.target.outputs.branch }}
          TARGET_REF: ${{ steps.target.outputs.ref }}
          TARGET_SHA: ${{ steps.target.outputs.sha }}
        run: |
          set -euo pipefail
          BODY_FILE="$(mktemp)"
          {
            echo "Rolling upstream-main sync for review. This PR is updated whenever upstream/main advances."
            echo
            echo "- Upstream ref: \`$TARGET_REF\`"
            echo "- Upstream commit: \`$TARGET_SHA\`"
            echo "- Fork-owned \`.github/\` automation is intentionally preserved and is not imported from upstream."
            echo
            echo "Before merging:"
            echo "- Wait for build and security checks."
            echo "- Use the AI risk score as triage, not a guarantee."
            echo "- A bot approval is allowed only after deterministic checks and only for low-risk, non-sensitive changes."
            echo "- Manually inspect auth, crypto, backup, import/export, dependencies, workflows, and deployment changes."
            echo "- Never merge while a required check is failing."
            echo "- A low-risk PR is auto-merged only after every required check passes; sensitive changes remain manual."
          } > "$BODY_FILE"

          EXISTING="$(gh api "repos/$REPO/pulls?state=open&head=$OWNER:$REVIEW_BRANCH&base=main" --jq '.[0].number // empty')"
          if [ -n "$EXISTING" ]; then
            jq -n \
              --arg title "Review upstream NodeWarden $TARGET_REF @ ${TARGET_SHA:0:12}" \
              --arg body "$(cat "$BODY_FILE")" \
              '{title: $title, body: $body}' > pr-update.json
            gh api "repos/$REPO/pulls/$EXISTING" --method PATCH --input pr-update.json > /dev/null
            exit 0
          fi

          for attempt in 1 2 3 4 5; do
            jq -n \
              --arg title "Review upstream NodeWarden $TARGET_REF @ ${TARGET_SHA:0:12}" \
              --arg head "$OWNER:$REVIEW_BRANCH" \
              --arg base "main" \
              --arg body "$(cat "$BODY_FILE")" \
              '{title: $title, head: $head, base: $base, body: $body, maintainer_can_modify: true}' > pr-create.json

            if gh api "repos/$REPO/pulls" --method POST --input pr-create.json > /dev/null 2>&1; then
              exit 0
            fi

            echo "PR creation attempt $attempt failed, retrying..."
            sleep 5
          done

          echo "Failed to create PR after retries."
          exit 1

      - name: No pending upstream changes
        if: steps.check.outputs.needed != 'true'
        run: |
          echo "The selected upstream target is already present in main."
